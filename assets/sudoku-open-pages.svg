<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 700" role="img" aria-labelledby="title desc">
  <title id="title">Sudoku puzzle sheet</title>
  <desc id="desc">A warm cream puzzle page with a large sudoku grid and a few handwritten notes.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="10" dy="16" stdDeviation="12" flood-color="#081012" flood-opacity=".2"/>
    </filter>
    <pattern id="cells" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#77716a" stroke-width="1"/>
    </pattern>
    <pattern id="blocks" width="126" height="126" patternUnits="userSpaceOnUse">
      <rect width="126" height="126" fill="url(#cells)"/>
      <path d="M126 0H0V126" fill="none" stroke="#292624" stroke-width="3"/>
    </pattern>
  </defs>
  <g filter="url(#shadow)">
    <rect x="30" y="22" width="460" height="650" rx="4" fill="#f2e5d2"/>
    <text x="70" y="82" fill="#35302b" font-family="Georgia, serif" font-size="36" font-style="italic">Sudoku break</text>
    <text x="70" y="112" fill="#82786e" font-family="Arial, sans-serif" font-size="12" letter-spacing="2.5">PUZZLE 27 · MEDIUM</text>
    <rect x="70" y="150" width="378" height="378" fill="url(#blocks)"/>
    <g fill="#2c2825" font-family="Georgia, serif" font-size="25" text-anchor="middle" dominant-baseline="middle">
      <text x="91" y="171">5</text><text x="175" y="213">7</text><text x="301" y="171">8</text>
      <text x="427" y="255">2</text><text x="133" y="339">8</text><text x="259" y="381">4</text>
      <text x="343" y="465">1</text><text x="217" y="507">6</text><text x="427" y="423">9</text>
    </g>
    <path d="M78 578c48-13 91-12 130 1m24 0c53-13 103-11 151 2" fill="none" stroke="#8c7466" stroke-width="2.5" stroke-linecap="round"/>
    <text x="75" y="622" fill="#806f62" font-family="Georgia, serif" font-size="21" font-style="italic">caffeine, headphones, one more puzzle</text>
  </g>
</svg>
