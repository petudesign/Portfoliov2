  <ellipse class="cond-head" cx="50" cy="45" rx="14.5" ry="16.5"/>
  <g class="cond-left" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path class="cond-sleeve" d="M37 72 14 69.5"/>
