<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e0f11">
<link rel="icon" href="/assets/favicon.svg?v=2" type="image/svg+xml">
<title>Page not found — Petteri Helttula</title>
<link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Geist";src:url("/fonts/Geist-Variable.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:block}
:root{
  --bg:#0e0f11; --raise:#17181b; --ink:#eeeeeb; --mute:#a3a4a9; --faint:#7c7e86; --hair:#26272b;
  --accent:#e5173f; --accent-hi:#f0697c;
  --sans:"Geist","Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.23,1,.32,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
::selection{background:#571221;color:inherit}
html{background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font:17px/1.55 var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.page{width:100%;max-width:864px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:28px 96px;flex:1;display:flex;flex-direction:column}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.home{display:inline-flex;align-items:center;gap:12px;text-decoration:none;min-height:44px}
.home img{width:33px;height:44px;border-radius:7px;object-fit:cover;background:#f8f4e7}
.home span{font-weight:430;font-size:17px;letter-spacing:-.01em;transition:color 200ms ease}
@media (hover:hover) and (pointer:fine){.home:hover span{color:var(--accent-hi)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 17px;line-height:1;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;font-size:14.5px;text-decoration:none;transition:transform 160ms var(--ease)}
.btn:active{transform:scale(.97)}
.swap{display:inline-grid;align-items:center}.swap svg{display:block}.swap>*{grid-area:1/1;transition:opacity 200ms ease,filter 200ms ease,transform 200ms var(--ease)}
.swap .b{opacity:0;filter:blur(2px);transform:translateY(4px)}
.is-copied .swap .a{opacity:0;filter:blur(2px);transform:translateY(-4px)}.is-copied .swap .b{opacity:1;filter:none;transform:none}

.miss{margin:auto 0;padding:96px 0}
.code{margin:0;font-size:14px;color:var(--accent-hi);font-variant-numeric:tabular-nums;letter-spacing:.02em}
h1{margin:14px 0 0;font-weight:600;font-size:clamp(44px,7vw,72px);line-height:1.02;letter-spacing:-.05em}
.miss p.lead{margin:24px 0 0;max-width:30em;font-size:clamp(18px,2vw,20px);line-height:1.45;letter-spacing:-.015em;color:var(--mute);text-wrap:pretty}
.back{display:inline-flex;align-items:center;gap:8px;margin-top:36px;min-height:42px;padding:0 18px;border:1px solid var(--hair);border-radius:999px;font-size:14.5px;text-decoration:none;transition:border-color 200ms ease,transform 160ms var(--ease)}
.back svg{width:15px;height:15px;transition:transform 240ms var(--ease)}
@media (hover:hover) and (pointer:fine){.back:hover{border-color:#3a3b41}.back:hover svg{transform:translateX(-3px)}}
.back:active{transform:scale(.97)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px}
@media (max-width:640px){
  .page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 64px}
  .btn .t{display:none}
}
@media (prefers-reduced-motion: reduce){.btn,.swap>*,.back,.back svg{transition:none}}
</style>
</head>
<body>
<main class="page">
  <header class="top">
    <a class="home" href="/" aria-label="Back to Petteri Helttula’s portfolio"><img src="/avatar.jpg" alt="" width="33" height="44"><span>Petteri Helttula</span></a>
    <button class="btn" id="copyEmail" type="button"><span class="swap" aria-hidden="true"><span class="a"><svg viewBox="0 0 16 16"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 3.5v-.5a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h.5"/></svg></span><span class="b"><svg viewBox="0 0 16 16"><path d="M3.5 8.5 6.5 11.5 12.5 4.5"/></svg></span></span><span class="swap t"><span class="a">Copy email</span><span class="b" aria-hidden="true">Copied</span></span></button>
  </header>

  <section class="miss" aria-labelledby="missT">
    <p class="code">404</p>
    <h1 id="missT">That page isn’t here.</h1>
    <p class="lead">The link may have moved, or the address has a typo. Everything current is on the main page.</p>
    <a class="back" href="/"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8H3.5M7.5 3.5 3 8l4.5 4.5"/></svg>Back to portfolio</a>
  </section>
</main>
<div class="toast" id="toast" role="status" hidden></div>
<script>
const EMAIL="helttula.petteri@gmail.com",toast=document.getElementById("toast"),copyBtn=document.getElementById("copyEmail");let ct,tt;
copyBtn.addEventListener("click",()=>{(navigator.clipboard?navigator.clipboard.writeText(EMAIL):Promise.reject()).then(()=>{copyBtn.classList.add("is-copied");clearTimeout(ct);ct=setTimeout(()=>copyBtn.classList.remove("is-copied"),1800)},()=>{toast.textContent=EMAIL;toast.hidden=false;clearTimeout(tt);tt=setTimeout(()=>toast.hidden=true,2600)})});
</script>
</body>
</html>
