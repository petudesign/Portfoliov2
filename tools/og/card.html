<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:Geist;src:url("/fonts/Geist-Variable.woff2") format("woff2");font-weight:100 900}
:root{--bg:#0e0f11;--ink:#eeeeeb;--mute:#a3a4a9;--accent:#e5173f}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--bg)}
body{font-family:Geist,"Helvetica Neue",Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;position:relative}
.text{position:absolute;left:96px;top:0;bottom:0;width:720px;display:flex;flex-direction:column;justify-content:center}
.name{font-size:26px;letter-spacing:-.01em;color:var(--mute)}
h1{margin:22px 0 0;font-weight:450;font-size:76px;line-height:1.04;letter-spacing:-.045em}
.line{display:block;overflow:hidden;padding-bottom:.1em;margin-bottom:-.1em}
.line>span{display:inline-block;position:relative}
.sub{margin:30px 0 0;font-size:31px;line-height:1.3;letter-spacing:-.02em;color:var(--mute);max-width:640px}
.u{position:absolute;left:-6px;right:-10px;top:84%;height:30px;overflow:visible;fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round}
.photo{position:absolute;right:96px;top:182px;width:200px;height:266px;border-radius:22px;overflow:hidden;background:#f8f4e7;box-shadow:0 0 0 1px rgba(255,255,255,.07)}
.photo img{display:block;width:100%;height:100%}
</style></head>
<body>
<div class="text">
  <div class="name" id="name">Petteri Helttula</div>
  <h1><span class="line"><span id="l1">Product designer</span></span><span class="line"><span id="l2">based in <span style="position:relative">Helsinki.<svg class="u" viewBox="0 0 300 30" preserveAspectRatio="none" aria-hidden="true"><path id="u" pathLength="1" d="M4 18 C 60 9, 120 8, 170 12 S 250 20, 296 10"/></svg></span></span></span></h1>
  <p class="sub" id="sub">I design products and build them<br>with AI agents, guided by data.</p>
</div>
<div class="photo" id="photo"><img src="tile.jpg" alt=""></div>
<script>
const clamp=(x)=>Math.max(0,Math.min(1,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const out=(x)=>1-Math.pow(1-x,4);          /* close to the site's cubic-bezier(.23,1,.32,1) */
const io=(x)=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const inq=(x)=>x*x*x;
const spring=(t)=>{if(t<=0)return 0;const z=.62,w=13,wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+z*w/wd*Math.sin(wd*t))};
const $=(id)=>document.getElementById(id);
/* 4 s loop. Frame 0 is the settled card. 0.30–0.62 everything leaves, then the card builds again the way the site's hero enters, and holds from about 2.4 s. */
window.render=(t)=>{
  const gone=inq(seg(t,.30,.62));              /* 0 settled → 1 gone */
  const back=t>=.62;
  const vis=(a,d)=>back?out(seg(t,a,a+d)):1-gone;
  /* name */
  const n=back?out(seg(t,.72,1.22)):1;
  $("name").style.opacity=back?n:1-gone;
  $("name").style.transform=`translateY(${back?(1-n)*12:0}px)`;
  /* headline lines rise out of their own mask */
  [["l1",.80],["l2",.90]].forEach(([id,a])=>{const p=back?out(seg(t,a,a+.75)):1;
    $(id).style.transform=`translateY(${(1-p)*105}%)`;$(id).style.opacity=back?1:1-gone});
  /* underline draws at an even pace once Helsinki has landed */
  const u=back?io(seg(t,1.40,2.05)):1-io(seg(t,.30,.55));
  $("u").style.strokeDasharray="1 1";$("u").style.strokeDashoffset=String(1-u);$("u").style.opacity=u<.004?0:1;
  /* supporting line: fade, short rise and a clearing blur */
  const s=back?out(seg(t,1.10,1.75)):1;
  $("sub").style.opacity=back?s:1-gone;
  $("sub").style.transform=`translateY(${back?(1-s)*14:0}px)`;
  $("sub").style.filter=back&&s<1?`blur(${(1-s)*6}px)`:"none";
  /* portrait springs up with a small turn */
  const p=back?spring(t-1.0):1;
  const ph=$("photo");
  ph.style.opacity=back?clamp((t-1.0)/.25):1-gone;
  ph.style.transform=back?`translateY(${(1-p)*28}px) scale(${.9+.1*p}) rotate(${(1-p)*-5}deg)`:`scale(${1-.04*gone})`;
};
window.render(0);
</script>
</body></html>
